name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}name: Build and push the Docker image
       - uses: docker/build-push-action@v5
        with:
          context: ./python-project
          push: true
          tags: ghcr.io/emmanuelchichebemxi-bot/flask-dating-site:latest

